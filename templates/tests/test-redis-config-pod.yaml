{{- if and .Values.tests.enabled (or (eq (default "memory" .Values.editorDataStorage) "sentinel") (eq (default "memory" .Values.editorStatStorage) "sentinel")) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ds.resources.name" (list . .Values.commonNameSuffix "test-redis-config") }}
  namespace: {{ include "ds.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: test-redis-config
    {{- if .Values.commonLabels }}
    {{- include "ds.labels.commonLabels" . | trim | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- if .Values.imagePullSecrets }}
  imagePullSecrets:
  - name: {{ .Values.imagePullSecrets }}
  {{- end }}
  containers:
  - name: redis-config
    image: {{ .Values.docservice.image.repository }}:{{ default .Values.images.tag .Values.docservice.image.tag }}
    imagePullPolicy: {{ .Values.docservice.image.pullPolicy }}
    command: ["bash", "/scripts/test_redis_config.sh"]
    env:
    - name: COMPANY_NAME
      value: {{ .Values.product.name | quote }}
    - name: ENTRYPOINT_CONFIG_ONLY
      value: "true"
    - name: JWT_ENABLED
      value: "false"
    {{ include "ds.redis.env" . | nindent 4 }}
    envFrom:
    - configMapRef:
        name: {{ include "ds.resources.name" (list . .Values.commonNameSuffix "documentserver") }}
    volumeMounts:
    - name: test-redis-config
      mountPath: /scripts/test_redis_config.sh
      subPath: test_redis_config.sh
  volumes:
  - name: test-redis-config
    configMap:
      name: {{ include "ds.resources.name" (list . .Values.commonNameSuffix "test-redis-config") }}
      defaultMode: 0755
{{- end }}
